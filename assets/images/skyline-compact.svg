<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 130" preserveAspectRatio="xMidYMax meet" fill="none" aria-hidden="true" class="footer-skyline-svg footer-skyline-compact">
  <defs>
    <style>
      .arch-fill { fill: #1F2C46; }
      .arch-tier-fill { fill: rgba(31, 44, 70, 0.4); }
      .arch-stroke { stroke: rgba(255, 255, 255, 0.85); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arch-stroke-soft { stroke: rgba(255, 255, 255, 0.45); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <!-- 1. Campus Mosque (Left) Stepped Tiers & Arch -->
  <!-- Tier 1 -->
  <rect x="18" y="106" width="114" height="24" class="arch-tier-fill" />
  <rect x="18" y="106" width="114" height="24" class="arch-stroke" />
  <!-- Tier 2 -->
  <rect x="32" y="82" width="86" height="24" class="arch-tier-fill" />
  <rect x="32" y="82" width="86" height="24" class="arch-stroke" />
  <!-- Tier 3 -->
  <rect x="46" y="58" width="58" height="24" class="arch-tier-fill" />
  <rect x="46" y="58" width="58" height="24" class="arch-stroke" />
  <!-- Top Arch (In user reference style) -->
  <path d="M 57 58 L 57 32 A 18 18 0 0 1 93 32 L 93 58 Z" class="arch-fill" />
  <path d="M 57 58 L 57 32 A 18 18 0 0 1 93 32 L 93 58" class="arch-stroke" />
  <line x1="75" y1="14" x2="75" y2="4" class="arch-stroke" />
  <!-- Portal Arches -->
  <path d="M 66 130 L 66 112 A 9 9 0 0 1 84 112 L 84 130" class="arch-stroke" />
  <path d="M 32 130 L 32 118 A 6 6 0 0 1 44 118 L 44 130" class="arch-stroke-soft" />
  <path d="M 106 130 L 106 118 A 6 6 0 0 1 118 118 L 118 130" class="arch-stroke-soft" />

  <!-- 2. Minaret -->
  <rect x="144" y="112" width="12" height="18" class="arch-tier-fill" />
  <rect x="144" y="112" width="12" height="18" class="arch-stroke" />
  <rect x="146" y="46" width="8" height="66" class="arch-tier-fill" />
  <rect x="146" y="46" width="8" height="66" class="arch-stroke" />
  <rect x="143" y="42" width="14" height="4" class="arch-stroke" />
  <path d="M 146 42 L 146 30 A 4 4 0 0 1 154 30 L 154 42 Z" class="arch-fill" />
  <path d="M 146 42 L 146 30 A 4 4 0 0 1 154 30 L 154 42" class="arch-stroke" />
  <line x1="150" y1="26" x2="150" y2="16" class="arch-stroke" />

  <!-- 3. Main Academic Campus Building (Center) -->
  <!-- Tier 1 -->
  <rect x="176" y="104" width="128" height="26" class="arch-tier-fill" />
  <rect x="176" y="104" width="128" height="26" class="arch-stroke" />
  <!-- Tier 2 -->
  <rect x="190" y="80" width="100" height="24" class="arch-tier-fill" />
  <rect x="190" y="80" width="100" height="24" class="arch-stroke" />
  <!-- Tier 3 -->
  <rect x="214" y="56" width="52" height="24" class="arch-tier-fill" />
  <rect x="214" y="56" width="52" height="24" class="arch-stroke" />
  <!-- Top Center Arch -->
  <path d="M 224 56 L 224 34 A 16 16 0 0 1 256 34 L 256 56 Z" class="arch-fill" />
  <path d="M 224 56 L 224 34 A 16 16 0 0 1 256 34 L 256 56" class="arch-stroke" />
  <!-- Grand Entrance Arch Portal -->
  <path d="M 230 130 L 230 96 A 10 10 0 0 1 250 96 L 250 130" class="arch-stroke" />
  <!-- Wing Window Arches -->
  <path d="M 188 130 L 188 116 A 6 6 0 0 1 200 116 L 200 130" class="arch-stroke-soft" />
  <path d="M 280 130 L 280 116 A 6 6 0 0 1 292 116 L 292 130" class="arch-stroke-soft" />

  <!-- 4. Open Book on Rehl Stand -->
  <rect x="326" y="122" width="48" height="8" class="arch-tier-fill" />
  <rect x="326" y="122" width="48" height="8" class="arch-stroke" />
  <path d="M 340 122 L 340 112 A 10 10 0 0 1 360 112 L 360 122" class="arch-stroke" />
  <path d="M 324 110 C 334 100, 346 100, 350 104 C 354 100, 366 100, 376 110" class="arch-stroke" />
  <line x1="350" y1="104" x2="350" y2="122" class="arch-stroke" />

  <!-- Ground Line -->
  <line x1="0" y1="130" x2="390" y2="130" class="arch-stroke" />
</svg>