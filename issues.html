<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Institute Issues Hub | Hadi Education System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/discipline.css?v=v11priority">

  <style>
    /* Standalone Issues Hub Page Styling */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #F1F5F9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .standalone-issues-wrapper {
      width: 100%;
      max-width: 1140px;
      margin: 1.5rem auto 3rem auto;
      padding: 0 1rem;
      box-sizing: border-box;
    }

    .standalone-issues-card {
      background: #FFFFFF;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(7, 26, 66, 0.22);
      border: 1px solid rgba(226, 232, 240, 0.8);
      position: relative;
    }

    @media (max-width: 768px) {
      .standalone-issues-wrapper {
        margin: 0.5rem auto 2rem auto;
        padding: 0 0.5rem;
      }
      .standalone-issues-card {
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="standalone-issues-wrapper">
    <div class="standalone-issues-card">
      
      <!-- 1. Header with Deep Blue Gradient & Graduation Cap Shield -->
      <div class="modal-header issues-hub-header">
        <div class="issues-header-brand">
          <div class="issues-shield-badge">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
          </div>
          <div class="issues-header-divider"></div>
          <div class="issues-modal-title-group">
            <h3 class="modal-title issues-title">
              <span>Institute</span> <span class="issues-title-highlight">Issues Hub</span>
            </h3>
            <p id="issues-header-subtitle" class="issues-subtitle">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2.5"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
              <span id="issues-header-count-text">2 unsolved of 4 total</span>
            </p>
          </div>
        </div>
        <a href="discipline.html" class="issues-circle-close-btn" title="Back to Discipline Dashboard" aria-label="Close issues hub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </a>
      </div>

      <!-- 2. Main Body Container -->
      <div class="modal-body issues-hub-body">
        
        <!-- Filter Buttons: All, Unsolved, Solved -->
        <div class="issue-filter-buttons">
          <button type="button" class="issue-filter-btn btn-all-issues active" data-status="all" title="View All Institute Issues">
            <svg class="filter-svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            <span class="btn-text-full">All Issues</span>
            <span class="btn-text-short">All</span>
            <span id="issue-count-all" class="count-badge count-badge-blue">4</span>
          </button>
          <button type="button" class="issue-filter-btn btn-unsolved-issues" data-status="unsolved" title="View Only Unsolved Problems">
            <svg class="filter-svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span class="btn-text-full">Unsolved</span>
            <span class="btn-text-short">Unsolved</span>
            <span id="issue-count-unsolved" class="count-badge count-badge-red">2</span>
          </button>
          <button type="button" class="issue-filter-btn btn-solved-issues" data-status="solved" title="View Resolved / Solved Issues">
            <svg class="filter-svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <span class="btn-text-full">Solved</span>
            <span class="btn-text-short">Solved</span>
            <span id="issue-count-solved" class="count-badge count-badge-green">2</span>
          </button>
        </div>

        <!-- Toolbar Row: Search Input, Dropdowns, + Add Issue Button -->
        <div class="issue-action-bar">
          <div class="issue-search-wrap">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="issue-search-input" class="issue-search-box" placeholder="Search issues by title, details or reporter..." aria-label="Search institute issues">
          </div>
          <div class="issue-dropdowns-group">
            <div class="select-pill-wrap">
              <select id="issue-priority-filter" class="issue-toolbar-select" aria-label="Filter by priority">
                <option value="all">All Priorities</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
            <div class="select-pill-wrap">
              <select id="issue-sort-select" class="issue-toolbar-select" aria-label="Sort issues">
                <option value="newest">Newest</option>
                <option value="priority">Priority (High first)</option>
                <option value="efforts">Most efforts</option>
              </select>
            </div>
          </div>
          <button id="open-add-issue-btn" class="issue-add-btn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>+ Add Issue</span>
          </button>
        </div>

        <!-- Priority Color Legend -->
        <div class="issues-priority-legend" aria-label="Priority color legend">
          <span class="legend-item"><span class="legend-dot dot-high"></span>High</span>
          <span class="legend-item"><span class="legend-dot dot-medium"></span>Medium</span>
          <span class="legend-item"><span class="legend-dot dot-low"></span>Low</span>
          <span class="legend-item"><span class="legend-dot dot-solved"></span>Solved</span>
        </div>

        <!-- 2x2 Grid for Issue Cards -->
        <div id="issues-list-container" class="issues-grid"></div>
      </div>

      <!-- 3. Modal Footer: Light Blue Wave Banner with Shield Check & Pill Close Button -->
      <div class="modal-footer issues-hub-footer">
        <div class="issues-footer-tagline">
          <div class="issues-footer-shield">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <span class="issues-tagline-text">Better Management • A More Efficient Campus</span>
        </div>
        <a href="discipline.html" class="issues-pill-close-btn" title="Close and return to dashboard">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          <span>Close</span>
        </a>
      </div>

    </div>
  </div>

  <!-- Add Issue Modal -->
  <div id="add-issue-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">Define New Institute Issue</h3>
        <button class="modal-close-btn" onclick="closeModal('add-issue-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="add-issue-form">
          <div class="form-group">
            <label for="issue-title-input" class="form-label">Issue Title *</label>
            <input type="text" id="issue-title-input" class="form-control" placeholder="e.g. 2nd Floor washroom water leakage" required maxlength="120">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="issue-category-select" class="form-label">Category</label>
              <select id="issue-category-select" class="form-control">
                <option value="Facilities">Facilities</option>
                <option value="Hygiene & Facilities">Hygiene & Facilities</option>
                <option value="Punctuality">Punctuality</option>
                <option value="Academics & IT">Academics & IT</option>
                <option value="General">General</option>
              </select>
            </div>
            <div class="form-group">
              <label for="issue-priority-select" class="form-label">Priority Tier</label>
              <select id="issue-priority-select" class="form-control">
                <option value="High" selected>High (Urgent)</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="issue-desc-input" class="form-label">Description & Observations</label>
            <textarea id="issue-desc-input" class="form-control" rows="3" placeholder="Provide clear details on what needs to be fixed..."></textarea>
          </div>
          <div class="modal-footer" style="padding: 1rem 0 0 0;">
            <button type="button" class="btn btn-secondary" onclick="closeModal('add-issue-modal')">Cancel</button>
            <button type="submit" class="btn btn-primary">+ Save Issue</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Issue Detail & Efforts Modal -->
  <div id="issue-detail-modal" class="modal-overlay">
    <div class="modal-container modal-wide">
      <div class="modal-header">
        <h3 class="modal-title" id="detail-issue-title">Issue Details</h3>
        <button class="modal-close-btn" onclick="closeModal('issue-detail-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="issue-detail-content"></div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Core App Scripts -->
  <script src="assets/js/firebase-config.js?v=v11priority"></script>
  <script src="assets/js/discipline-auth.js?v=v11priority"></script>
  <script src="assets/js/discipline-app.js?v=v11priority"></script>

  <script>
    // Ensure issues list renders immediately on standalone page load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (window.appController) {
          window.appController.renderIssuesHub();
        }
      }, 100);
    });
  </script>
</body>
</html>
